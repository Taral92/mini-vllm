[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "A typed, educational skeleton for a compact LLM inference engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic",
  "torch",
  "transformers",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[project.scripts]
mini-vllm = "run:main"
mini-vllm-benchmark = "benchmarks.harness:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "server*", "benchmarks*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 88
